# Isolated stack for the editor workspace. Postgres/Redis stay on the compose
# network (no host binds) so this does not fight a host `docker compose up`.
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/studio:cached
      # Keep Linux node_modules off the Windows bind mount
      - frontend-node-modules:/workspaces/studio/frontend/node_modules
    working_dir: /workspaces/studio
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/studio
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: development-signing-key-change-me-32chars
      JWT_ISSUER: studio-api
      JWT_AUDIENCE: studio-web
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:8080,https://example.com
      SEED_ADMIN_EMAIL: admin@studio.local
      SEED_ADMIN_PASSWORD: Admin123!
      TRUST_PROXY_HEADERS: "false"
      PUBLIC_API_BASE_URL: http://localhost:3001
      APP_BASE_URL: http://localhost:5173
      VITE_API_BASE_URL: /api
      VITE_DEV_API_PROXY: http://127.0.0.1:3001
    ports:
      - "3001:3001"
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sleep infinity

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - devcontainer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  frontend-node-modules:
  devcontainer-postgres-data:
