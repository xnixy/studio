    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {

          },
          {

            "url": "https://example.com/",
            "name": "Studio",
            "description": "Make Talking, Photo, Scene, and stills in chat",
            "publisher": { "@id": "https://example.com/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Studio",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web",
            "url": "https://example.com/",
            "description": "Make Talking, Photo, Scene, and stills for TikTok, Reels, and Shorts. One box, then we confirm the kind. Download the file.",
            "offers": {

    <script>
      (function () {
        /*
         * First-paint = solid black/grey canvas + system blue accent.
         * Keep in sync with ui/theme/brand.ts. No wallpaper / material layers.
         */
        var palette = {
          dark: { bg: "#000000", fg: "#f5f5f7", rgb: "10 132 255" },
          light: { bg: "#f2f2f7", fg: "#111111", rgb: "0 122 255" },
        };

        var resolved = "dark";
        try {
          var stored = localStorage.getItem("studio.theme") || "system";
          resolved =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : stored === "light"
                ? "light"
                : "dark";
          try {
            localStorage.removeItem("studio.brand");
            localStorage.removeItem("studio.material");
            localStorage.removeItem("studio.perf");
          } catch (_) {}
        } catch (e) {
          try {
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          } catch (_) {}
        }

        var mode = palette[resolved];
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.dataset.brand = "black";
        root.removeAttribute("data-material");
        root.removeAttribute("data-perf");
        root.style.colorScheme = resolved;
        root.style.setProperty("--studio-bg", mode.bg);
        root.style.setProperty("--studio-fg", mode.fg);
        root.style.setProperty("--studio-brand-rgb", mode.rgb);
        root.style.setProperty("--studio-wallpaper-opacity", "0");
        root.style.setProperty("--studio-material-blur", "0px");
        root.style.backgroundColor = mode.bg;
        root.style.color = mode.fg;

        window.__studioBoot = { bg: mode.bg, fg: mode.fg };

        try {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mode.bg);
        } catch (_) {}
      })();
    </script>
    <style>
      /*
       * Critical boot paint: solid canvas only.
       * Theme JS takes over after React mounts.
       */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: var(--studio-bg, #000000);
        color: var(--studio-fg, #f5f5f7);
      }
      #root {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        background-color: transparent;
        color: inherit;
      }
      #studio-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: inherit;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background-color: var(--studio-bg, #000000);
      }
      #studio-boot[data-done] {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
      #studio-boot .studio-boot-inner {
        display: grid;
        justify-items: center;
        gap: 1rem;
      }
      #studio-boot .studio-boot-mark {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        opacity: 0.9;
      }
      #studio-boot .studio-boot-spinner {
        box-sizing: border-box;
        width: 1.75rem;
        height: 1.75rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.55;
        animation: studio-boot-spin 0.75s linear infinite;
      }
      #studio-boot .studio-boot-label {
        margin: 0;
        font-size: 0.8125rem;
        letter-spacing: 0.02em;
        opacity: 0.55;
      }
      @keyframes studio-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #studio-boot .studio-boot-spinner {
          animation: none;
          border-right-color: currentColor;
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var boot = window.__studioBoot || { bg: "#000000", fg: "#f5f5f7" };
        document.body.style.backgroundColor = boot.bg;
        document.body.style.color = boot.fg;
      })();
    </script>
    <!--
      Boot lives OUTSIDE #root so React mount doesn't tear it down and flash a second spinner.
      App dismisses it once the first real route paints (see bootShell.ts / BootDismiss).
    -->
    <div id="studio-boot" role="status" aria-live="polite" aria-busy="true" aria-label="Loading">
      <div class="studio-boot-inner">
        <p class="studio-boot-mark">Studio</p>
        <div class="studio-boot-spinner" aria-hidden="true"></div>
        <p class="studio-boot-label">Loading</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
