    <ellipse cx="1500" cy="300" rx="280" ry="170" fill="#b0c0ff"/>
    <ellipse cx="1000" cy="780" rx="340" ry="190" fill="#f0b8c8"/>
  </g>
  <rect x="0" y="220" width="1920" height="3" fill="url(#beam)" transform="rotate(-7 960 540)"/>
  <rect x="0" y="540" width="1920" height="2" fill="url(#beam)" transform="rotate(5 960 540)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.55"/>
