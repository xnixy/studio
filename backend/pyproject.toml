[project]
name = "studio-backend"
version = "0.1.0"
description = "studio FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "bcrypt==4.0.1",
    "boto3==1.35.99",
    "cryptography==43.0.3",
    "email-validator==2.2.0",
    "fastapi[standard]==0.139.0",
    "greenlet==3.5.3",
    "httpx==0.27.0",
    "imageio-ffmpeg==0.6.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.3.4",
    "PyJWT==2.8.0",
    "redis==5.0.7",
    "SQLAlchemy==2.0.51",
    "stripe==15.3.0",
    "uvicorn[standard]==0.30.3",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

# FastAPI Cloud / `fastapi run` import path (module:variable).
# Also keep top-level main.py for file auto-discovery when CWD has sources.
[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", "scripts*"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
app = ["*.json"]
